{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Login</h1>
<form method="post">
  {% csrf_token %}
  <label>Usuário:</label>
  <input type="text" name="username" required>
  <br>
  <label>Senha:</label>
  <input type="password" name="password" required>
  <br>
  <button type="submit">Entrar</button>
</form>
</div>
{% endblock %}
