{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">

<div class="d-flex justify-content-center mt-5">
  <div class="glass-card p-5 shadow-sm" style="max-width: 400px; width: 100%;">
    <h1 class="mb-4 text-center">Login</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="username" class="form-label">Usuário:</label>
        <input type="text" id="username" name="username" class="form-control styled-input" required autofocus>
      </div>
      
      <div class="mb-4">
        <label for="password" class="form-label">Senha:</label>
        <input type="password" id="password" name="password" class="form-control styled-input" required>
      </div>
      
      <button type="submit" class="btn btn-info w-100 btn-modern">
        Entrar
      </button>
    </form>

    <div class="mt-3 text-center">
      <p>Não tem uma conta? <a href="{% url 'cadastrar' %}" class="link-info text-decoration-none">Cadastre-se aqui</a></p>
    </div>
  </div>
</div>

<style>
  body {
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    color: #fff;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: saturate(180%) blur(20px);
    border-radius: 2rem;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  .form-label {
    color: #fff;
  }

  .styled-input {
    background-color: transparent;
    border: 2px solid #fff;
    color: #fff;
    border-radius: 50px;
    padding-left: 15px;
    padding-right: 15px;
  }

  .styled-input:focus {
    background-color: rgba(255, 255, 255, 0.05);
    border-color: #89b4fa;
    box-shadow: none;
    color: #fff;
  }

  .btn-modern {
    border-radius: 50px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn-modern:hover:not(:disabled) {
    box-shadow: 0 0 12px #89b4faaa;
  }

  a.link-info {
    color: #89b4fa;
  }

  a.link-info:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}
