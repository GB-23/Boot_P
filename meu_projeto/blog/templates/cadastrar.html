{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Cadastrar</h2>
    <form>
        <div class="mb-3">
            <label>Nome</label>
            <input type="text" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control">
        </div>
        <div class="mb-3">
            <label>Senha</label>
            <input type="password" class="form-control">
        </div>
        <button class="btn btn-primary">Cadastrar</button>
    </form>
</div>
{% endblock %}
