{% extends "base.html" %}
{% block content %}
<h1>Lista de Pessoas</h1>
<table>
  <tr>
    <th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th>
  </tr>
  {% for p in pessoas %}
  <tr>
    <td>{{ p.nome }}</td>
    <td>{{ p.cpf }}</td>
    <td>{{ p.email }}</td>
    <td>{{ p.telefone }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="4">Nenhuma pessoa cadastrada.</td></tr>
  {% endfor %}
</table>
{% endblock %}
